name: benchmark

# §12.9's matrix, measured. Weekly and on demand, never on a pull request:
# GPU minutes cost money and throughput regression is not a correctness failure.
# Manual only. A scheduled job with no matching runner queues indefinitely and
# reports nothing, which is the failure mode this repository fixed for tests in
# v1.8 and would now be reproducing in CI. Run it by hand once a GPU runner
# exists; see docs/benchmarks/README.md.
on:
  workflow_dispatch:

jobs:
  matrix:
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the tooling
        run: pip install --quiet python-docx pymupdf imageio-ffmpeg
      - name: Confirm the encoder is the one §12.3 models
        run: |
          python - <<'PY'
          import imageio_ffmpeg, subprocess
          exe = imageio_ffmpeg.get_ffmpeg_exe()
          out = subprocess.run([exe, "-hide_banner", "-encoders"], capture_output=True, text=True).stdout
          if "h264_nvenc" not in out:
              raise SystemExit("::error::no h264_nvenc on this runner — §12.3 models NVENC")
          print("h264_nvenc present")
          PY
      - name: Render the matrix
        run: python build/benchmark.py docs/benchmarks
      - name: Keep the numbers
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: docs/benchmarks/*.json
