name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the two dependencies the document tooling needs
        run: pip install --quiet python-docx pymupdf sqlglot imageio-ffmpeg

      - name: Every asserted figure, recomputed
        run: python build/check_figures.py

      - name: Versions, enums, counts, numbering, fences
        run: python build/check_consistency.py

      - name: The migration parses and keeps its tenant keys
        run: python build/check_sql.py

      - name: The document's own worked examples, executed
        run: python -m unittest discover -s tests -t tests -v

      - name: No test may skip silently
        run: |
          python -m unittest discover -s tests -t tests -v 2>&1 | tee /tmp/all.txt
          if grep -qi "skipped" /tmp/all.txt; then
            echo "::error::a test skipped — ffmpeg or LibreOffice is missing, and a skip is not a pass"
            exit 1
          fi

      - name: The .docx still matches its source
        run: |
          DOCX=$(ls docs/spec/*.docx | sort -V | tail -1)
          echo "checking $DOCX"
          python build/extract_spec.py "$DOCX" /tmp/roundtrip.md /tmp/figs
          python build/check_figures.py /tmp/roundtrip.md
          python build/check_consistency.py /tmp/roundtrip.md

  layout:
    # The rendered-page check needs LibreOffice, which the default image lacks.
    # It runs on main only, because it costs two minutes and catches the class
    # of defect that only a page can show: split rows, collapsed builds.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache LibreOffice
        uses: actions/cache@v4
        with:
          path: /usr/lib/libreoffice
          key: lo-${{ runner.os }}-v1
      - name: Install the renderer and the tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer
          pip install --quiet python-docx pymupdf imageio-ffmpeg
      - name: The document, rendered and read
        run: |
          python -m unittest discover -s tests -t tests -k TestLayout -v 2>&1 | tee /tmp/layout.txt
          if grep -qi "skipped" /tmp/layout.txt; then
            echo "::error::the layout checks skipped — they are the point of this job"
            exit 1
          fi
